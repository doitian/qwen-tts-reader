[project]
name = "qwen-tts-reader"
version = "0.1.0"
description = "Read web articles aloud with Qwen Audio TTS in your terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "markdown-it-py>=3,<5",
  "pyyaml>=6,<7",
  "python-dotenv>=1,<2",
  "textual>=1,<9",
  "websockets>=15,<18",
]

[project.scripts]
qwen-reader = "qwen_reader.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_reader"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# Tiny local metadata/rename operations are intentional; large WAV assembly uses a thread.
ignore = ["ASYNC240"]
